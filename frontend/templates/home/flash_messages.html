{# Home: one-time messages from the server. #}
{% load static %}
{% if messages %}
<div class="flash-stack" id="flash-stack" role="status" aria-live="polite">
    {% for message in messages %}
    <div class="flash-msg {{ message.tags }}">
        <p>{{ message }}</p>
        <button type="button" class="flash-close" aria-label="بستن پیام" onclick="this.parentElement.remove()">×</button>
    </div>
    {% endfor %}
</div>
<script src="{% static 'js/home/flash-messages.js' %}?v=1" defer></script>
{% endif %}
