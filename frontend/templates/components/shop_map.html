{% load maps %}
<p class="text-xs sm:text-sm text-gray-500 mb-3 font-medium leading-6">{{ shop_address|default:"آدرس فروشگاه در تنظیمات ثبت نشده است." }}</p>
{% if shop_map_point %}
<div class="map-frame w-full h-40 sm:h-56 rounded-xl overflow-hidden flex items-center justify-center bg-slate-50" data-shop-map="{{ shop_map_point }}" data-shop-name="{{ shop_name|default:'فروشگاه' }}">
    <button type="button" onclick="loadShopMap(this)" class="inline-flex items-center gap-2 bg-white border border-gray-200 text-gray-700 font-bold text-xs px-4 py-3 rounded-xl hover:border-cyan-300 hover:text-cyan-700 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5" stroke-width="2"/></svg>
        نمایش نقشه فروشگاه
    </button>
</div>
<a href="{{ shop_map_point|neshan_url }}" data-neshan="{{ shop_map_point }}" target="_blank" rel="noopener" class="neshan-route btn-motion mt-3 flex items-center justify-center gap-2 w-full rounded-xl py-3 text-sm font-black text-white bg-gradient-to-l from-[#22d3ee] to-[#0891b2] shadow-lg shadow-cyan-500/25">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
    مسیریابی با نشان
</a>
{% endif %}
