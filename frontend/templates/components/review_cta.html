{% if order.status == 'delivered' %}
    {% if order.review %}
        <div class="review-done mt-4 mb-3 rounded-2xl px-4 py-3 flex items-center justify-between gap-3">
            <div class="min-w-0">
                <p class="text-[11px] font-bold text-gray-500">امتیاز شما به این سفارش</p>
                <div class="review-stars sm mt-1" aria-label="{{ order.review.rating }} ستاره">{% for i in "12345" %}<span class="{% if forloop.counter > order.review.rating %}off{% endif %}">★</span>{% endfor %}</div>
            </div>
            <span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-full px-3 py-1 shrink-0">ممنون از نظرتان</span>
        </div>
    {% else %}
        <div class="review-cta mt-4 mb-3 rounded-2xl p-4 sm:p-5" data-review-cta="{{ order.id }}">
            <div class="flex items-center gap-3">
                <span class="review-cta-icon" aria-hidden="true">★</span>
                <div class="min-w-0">
                    <p class="font-black text-sm text-gray-900">تجربه‌تان از سفارش #{{ order.id }} چطور بود؟</p>
                    <p class="text-[11px] text-gray-500 mt-0.5">با یک امتیاز کوتاه کمک کنید بهتر شویم.</p>
                </div>
            </div>
            <div class="review-cta-stars mt-3" role="group" aria-label="امتیاز دهید">
                {% for i in "12345" %}<button type="button" onclick="openReview('{{ order.id }}', {{ forloop.counter }})" aria-label="{{ forloop.counter }} ستاره">★</button>{% endfor %}
            </div>
        </div>
    {% endif %}
{% endif %}
