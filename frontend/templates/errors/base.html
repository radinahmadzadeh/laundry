{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>{% block title %}خطا{% endblock %} | خشکشویی و سفید شویی آرین</title>
<link rel="preload" href="{% static 'fonts/Vazirmatn-wght.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{% static 'css/vazirmatn.css' %}">
<link rel="stylesheet" href="{% static 'css/errors.css' %}?v=1">
</head>
<body>
<main class="card">
    <div class="code">{% block code %}!{% endblock %}</div>
    <h1>{% block heading %}مشکلی پیش آمد{% endblock %}</h1>
    <p>{% block message %}{% endblock %}</p>
    <div class="actions">
        <a class="primary" href="/">بازگشت به صفحه اصلی</a>
        <a class="secondary" href="/pricing/">مشاهده لیست قیمت</a>
    </div>
</main>
</body>
</html>
