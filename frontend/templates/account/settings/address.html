{# Account settings: saved address with map and postal code. #}
<div class="card rv-a rounded-3xl p-6">
  <h2 class="font-black text-sm mb-1 flex items-center gap-2"><span class="step-dot"></span>آدرس من</h2>
  <p class="text-[11px] text-gray-500 mb-4">این آدرس هنگام ثبت سفارش یا درخواست پیک قابل انتخاب است؛ همیشه می‌توانید لوکیشن جدید هم مشخص کنید.</p>
  <form method="post" id="address-form" class="space-y-3">
    {% csrf_token %}
    <input type="hidden" name="form_type" value="address">
    <input type="hidden" name="lat" id="lat" value="{{ customer.address_latitude }}">
    <input type="hidden" name="lng" id="lng" value="{{ customer.address_longitude }}">
    <div id="map" class="w-full h-60 rounded-xl border border-gray-200"></div>
    <button type="button" id="locate-btn" class="btn-motion w-full bg-white border border-gray-200 text-gray-600 font-bold text-xs py-2.5 rounded-xl">استفاده از موقعیت فعلی من</button>
    <textarea name="address" id="address-text" rows="2" maxlength="1000" placeholder="آدرس متنی (خیابان، کوچه، پلاک، واحد)" class="field">{{ customer.address }}</textarea>
    <input name="postal" value="{{ customer.address_postal_code }}" type="tel" inputmode="numeric" maxlength="10" placeholder="کد پستی (۱۰ رقمی)" aria-label="کد پستی" data-postal-lookup="{% url 'postal_lookup' %}" data-lat="lat" data-lng="lng" data-addr="address-text" class="field text-center tracking-widest">
    <button class="btn-main btn-motion text-sm">ذخیره آدرس</button>
  </form>
  {% if customer.has_saved_address %}
  <form method="post" class="mt-3" onsubmit="return confirm('آدرس ثبت‌شده حذف شود؟')">
    {% csrf_token %}
    <input type="hidden" name="form_type" value="address_delete">
    <button class="w-full text-xs font-bold text-red-500 border border-red-100 bg-red-50 rounded-xl py-2.5">حذف آدرس ثبت‌شده</button>
  </form>
  {% endif %}
</div>
