{% extends 'panel/base.html' %}
{% block title %}ثبت سفارش جدید | پنل مدیریت{% endblock %}
{% block content %}
<h1 class="text-2xl font-black mb-6">ثبت سفارش جدید</h1>

<form method="post" class="grid md:grid-cols-3 gap-5">
    {% csrf_token %}

    <div class="md:col-span-1 space-y-5">
        <div class="panel rounded-2xl p-5">
            <h2 class="font-bold mb-3 text-sm">مشتری</h2>
            <select name="customer_id" id="customer_select" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2.5 text-sm mb-3">
                <option value="">— مشتری جدید —</option>
                {% for c in customers %}
                    <option value="{{ c.id }}">{{ c.name }} ({{ c.phone }})</option>
                {% endfor %}
            </select>
            <div id="new_customer_fields">
                <input type="text" name="new_customer_name" placeholder="نام مشتری جدید" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2.5 text-sm mb-3">
                <input type="tel" name="new_customer_phone" placeholder="شماره تماس" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2.5 text-sm dir-ltr">
            </div>
        </div>

        <div class="panel rounded-2xl p-5">
            <h2 class="font-bold mb-3 text-sm text-[var(--cyan)]">زمان تحویل (چند روز دیگر؟)</h2>
            <input type="number" name="delivery_days" value="2" min="0" placeholder="چند روز دیگر؟"
                   class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2.5 text-sm">
        </div>
    </div>

    <div class="md:col-span-2">
        <div class="panel rounded-2xl p-5">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-bold text-sm">اقلام سفارش</h2>
                <button type="button" onclick="addItemRow()" class="text-xs font-bold text-[var(--cyan)]">+ افزودن ردیف</button>
            </div>

            <div id="items_container" class="space-y-2 mb-2">
                <div class="item-row grid grid-cols-12 gap-2">
                    <select class="item-select col-span-5 bg-black/30 border border-white/10 rounded-lg px-2 py-2 text-xs" onchange="fillRowPrice(this)">
                        <option value="">انتخاب از لیست قیمت...</option>
                        {% for pi in price_items %}
                            <option value="{{ pi.name }}" data-price="{{ pi.dry_clean_price }}">{{ pi.category.name }} — {{ pi.name }}</option>
                        {% endfor %}
                    </select>
                    <input type="text" name="item_name[]" class="item-name-manual col-span-3 bg-black/30 border border-white/10 rounded-lg px-2 py-2 text-xs" placeholder="یا نام دستی">
                    <input type="number" name="item_qty[]" value="1" min="1" class="col-span-2 bg-black/30 border border-white/10 rounded-lg px-2 py-2 text-xs" placeholder="تعداد">
                    <input type="text" name="item_price[]" class="col-span-2 bg-black/30 border border-white/10 rounded-lg px-2 py-2 text-xs" placeholder="فی">
                </div>
            </div>

            <button type="submit" class="btn-primary w-full py-3 rounded-xl text-sm mt-4">ثبت سفارش</button>
        </div>
    </div>
</form>

<script>
function addItemRow(){
    var container = document.getElementById('items_container');
    var row = container.children[0].cloneNode(true);
    row.querySelectorAll('input').forEach(function(input){
        input.value = input.name === 'item_qty[]' ? '1' : '';
    });
    row.querySelector('select').selectedIndex = 0;
    container.appendChild(row);
}
function fillRowPrice(select){
    var opt = select.options[select.selectedIndex];
    var row = select.closest('.item-row');
    var manualInput = row.querySelector('.item-name-manual');
    var priceInput = row.querySelector('input[name="item_price[]"]');
    if (opt.value){
        manualInput.value = opt.value;
        priceInput.value = opt.getAttribute('data-price');
    }
}
document.getElementById('customer_select').addEventListener('change', function(){
    document.getElementById('new_customer_fields').style.display = this.value ? 'none' : 'block';
});
</script>
{% endblock %}
