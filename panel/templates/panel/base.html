<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}خشکشویی و سفید شویی آرین | پنل مدیریت{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root{
            --ink:#0f172a;
            --muted:#64748b;
            --bg:#f5f8fa;
            --card:rgba(255,255,255,.88);
            --line:rgba(15,23,42,.08);
            --cyan:#49e0d6;
            --cyan-deep:#0891b2;
            --violet:#9b8cfb;
            --amber:#f59e0b;
        }
        *{font-family:'Vazirmatn',sans-serif;box-sizing:border-box}
        html{background:var(--bg)}
        body{
            min-height:100vh;color:var(--ink);
            background:
                radial-gradient(circle at 8% 8%,rgba(73,224,214,.13),transparent 28%),
                radial-gradient(circle at 92% 90%,rgba(155,140,251,.13),transparent 30%),
                var(--bg);
        }
        .admin-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
        .admin-bubble{
            position:absolute;border-radius:50%;pointer-events:none;
            border:1px solid rgba(73,170,205,.24);
            background:radial-gradient(circle at 28% 24%,rgba(255,255,255,.98) 0 11%,rgba(255,255,255,.55) 12% 20%,rgba(73,224,214,.15) 42%,rgba(155,140,251,.10) 68%,transparent 80%);
            box-shadow:inset -8px -10px 18px rgba(124,58,237,.05),0 14px 35px rgba(8,145,178,.08);
            animation:adminBubbleFloat 7s ease-in-out infinite;
        }
        @keyframes adminBubbleFloat{
            0%,100%{transform:translate3d(0,25px,0) scale(.94);opacity:.35}
            50%{transform:translate3d(-12px,-28px,0) scale(1.05);opacity:.8}
        }
        .admin-content{position:relative;z-index:1}
        .panel{
            background:var(--card)!important;
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            border:1px solid var(--line)!important;
            box-shadow:0 24px 60px -38px rgba(15,23,42,.28);
        }
        .nav-link{
            color:#475569!important;
            transition:background .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;
            white-space:nowrap;
        }
        .nav-link.active{
            background:linear-gradient(115deg,var(--cyan),var(--violet))!important;
            color:#08232b!important;
            box-shadow:0 12px 28px -18px rgba(8,145,178,.5);
        }
        .nav-link:not(.active):hover{
            background:rgba(15,23,42,.045)!important;
            color:#0f172a!important;
            transform:translateY(-1px);
        }
        .btn-primary{
            background:linear-gradient(115deg,var(--cyan),var(--violet))!important;
            color:#08232b!important;
            font-weight:800;
            transition:filter .2s ease,transform .2s ease,box-shadow .2s ease;
            box-shadow:0 14px 28px -20px rgba(8,145,178,.45);
        }
        .btn-primary:hover{filter:brightness(1.04);transform:translateY(-1px)}
        input,select,textarea{
            color:#0f172a!important;
            background:rgba(248,250,252,.9)!important;
            border-color:rgba(15,23,42,.10)!important;
            min-height:42px;
        }
        input:focus,select:focus,textarea:focus{
            outline:none!important;
            border-color:rgba(8,145,178,.42)!important;
            box-shadow:0 0 0 3px rgba(8,145,178,.10)!important;
        }
        ::placeholder{color:#94a3b8!important}
        .text-white{color:#0f172a!important}
        .text-gray-300{color:#475569!important}
        .text-gray-400{color:#64748b!important}
        .text-gray-500{color:#94a3b8!important}
        .bg-black\/40,.bg-black\/30,.bg-black\/20{background:rgba(248,250,252,.92)!important}
        .bg-white\/10{background:rgba(15,23,42,.045)!important}
        .bg-white\/5,.bg-white\/\[0\.02\],.bg-white\/\[0\.025\]{background:rgba(15,23,42,.025)!important}
        .border-white\/10,.border-white\/5{border-color:rgba(15,23,42,.08)!important}
        .border-white\/\[0\.1\]{border-color:rgba(15,23,42,.08)!important}
        .hover\:bg-white\/20:hover{background:rgba(15,23,42,.08)!important}
        .hover\:bg-white\/5:hover{background:rgba(15,23,42,.04)!important}
        .hover\:bg-white\/\[0\.05\]:hover{background:rgba(15,23,42,.04)!important}
        .dir-ltr{direction:ltr;unicode-bidi:plaintext}
        table tbody tr{transition:background .2s ease}
        table tbody tr:hover{background:rgba(8,145,178,.035)!important}
        @media(max-width:768px){
            main{padding:18px!important}
            aside{position:relative!important}
        }
        @media(prefers-reduced-motion:reduce){.admin-bubble,.nav-link,.btn-primary{animation:none!important;transition:none!important}}
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen md:flex">
<div class="admin-bg" aria-hidden="true">
    <div class="admin-bubble" style="width:120px;height:120px;top:7%;right:5%;animation-duration:7.2s"></div>
    <div class="admin-bubble" style="width:58px;height:58px;top:34%;left:7%;animation-duration:5.6s;animation-delay:.8s"></div>
    <div class="admin-bubble" style="width:38px;height:38px;top:76%;right:18%;animation-duration:6.2s;animation-delay:1.2s"></div>
    <div class="admin-bubble" style="width:28px;height:28px;top:18%;left:31%;animation-duration:5s;animation-delay:.4s"></div>
</div>

<div class="admin-content min-h-screen w-full md:flex">
<aside class="w-full md:w-64 md:shrink-0 bg-white/72 backdrop-blur-xl border-b md:border-b-0 md:border-l border-slate-200/80 p-4 flex md:flex-col gap-1 overflow-x-auto md:overflow-visible md:sticky md:top-0 md:h-screen z-10">
    <div class="mb-1 md:mb-7 px-2 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-cyan-300 to-violet-300 flex items-center justify-center shadow-lg shadow-cyan-500/15">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M4 7.5A2.5 2.5 0 016.5 5h11A2.5 2.5 0 0120 7.5v9a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 014 16.5v-9z"/>
                    <path stroke-linecap="round" stroke-width="1.7" d="M8 9h8M8 13h5"/>
                </svg>
            </div>
            <div>
                <p class="text-sm font-black text-slate-900 leading-6">خشکشویی و سفید شویی آرین</p>
                <p class="text-[10px] text-slate-400">پنل مدیریت</p>
            </div>
        </div>
        <p class="text-[11px] text-slate-400 mt-3 px-1">{{ request.user.username }}</p>
    </div>

    <a href="{% url 'panel_dashboard' %}" class="nav-link {% if active == 'dashboard' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">داشبورد</a>
    <a href="{% url 'panel_orders' %}" class="nav-link {% if active == 'orders' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">سفارش‌ها</a>
    <a href="{% url 'panel_order_create' %}" class="nav-link {% if active == 'order_create' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">سفارش جدید</a>
    <a href="{% url 'panel_customers' %}" class="nav-link {% if active == 'customers' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">مشتریان</a>
    <a href="{% url 'panel_pricing' %}" class="nav-link {% if active == 'pricing' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">لیست قیمت</a>
    <a href="{% url 'panel_courier' %}" class="nav-link {% if active == 'courier' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">درخواست پیک</a>
    <a href="{% url 'panel_settings' %}" class="nav-link {% if active == 'settings' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">تنظیمات</a>

    <div class="md:mt-auto md:pt-4 md:border-t border-slate-200 shrink-0">
        <a href="{% url 'panel_logout' %}" class="nav-link rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2 text-red-500!">خروج</a>
    </div>
</aside>

<main class="flex-1 p-5 sm:p-8 relative z-[1]">
    {% if messages %}
        <div class="mb-5 space-y-2">
            {% for message in messages %}
                <div class="px-4 py-3 rounded-xl text-sm font-bold {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-600{% else %}bg-emerald-50 border border-emerald-200 text-emerald-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</div>
<script>
document.querySelectorAll('.money-auto').forEach(function(el){
    var raw=String(el.textContent||'').replace(/[^0-9.-]/g,'');
    if(raw) el.textContent=Number(raw).toLocaleString('en-US');
});
</script>
</body>
</html>
