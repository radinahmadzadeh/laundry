<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}خشکشویی و سفید شویی آرین | پنل مدیریت{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root{
            --bg:#07111f;--sidebar:#091625;--panel:rgba(12,27,43,.88);--panel-strong:#0e2236;
            --line:rgba(148,163,184,.13);--text:#e8f0f7;--muted:#8da3b8;
            --cyan:#49e0d6;--cyan-deep:#22c7d8;--violet:#9b8cfb;--amber:#fbbf24;
        }
        *{font-family:'Vazirmatn',sans-serif;box-sizing:border-box}
        html,body{min-height:100%;background:var(--bg)}
        body{
            color:var(--text);
            background:
              radial-gradient(circle at 7% 5%,rgba(73,224,214,.10),transparent 25%),
              radial-gradient(circle at 93% 92%,rgba(155,140,251,.10),transparent 27%),
              linear-gradient(145deg,#07111f,#091727 55%,#07111f);
        }
        .admin-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
        .admin-bg::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 82%)}
        .admin-bubble{
            position:absolute;border-radius:50%;pointer-events:none;border:1px solid rgba(73,224,214,.18);
            background:radial-gradient(circle at 28% 24%,rgba(255,255,255,.15) 0 10%,rgba(73,224,214,.09) 35%,rgba(155,140,251,.08) 62%,transparent 78%);
            box-shadow:inset -8px -10px 18px rgba(124,58,237,.06),0 18px 45px rgba(0,0,0,.20);
            animation:adminBubbleFloat 8s ease-in-out infinite;
        }
        @keyframes adminBubbleFloat{0%,100%{transform:translate3d(0,24px,0) scale(.94);opacity:.32}50%{transform:translate3d(-12px,-28px,0) scale(1.05);opacity:.72}}
        .admin-content{position:relative;z-index:1}
        .panel{
            background:var(--panel)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
            border:1px solid var(--line)!important;box-shadow:0 24px 70px -42px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.015);
        }
        .nav-link{color:#9fb2c4!important;transition:background .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;white-space:nowrap}
        .nav-link.active{background:linear-gradient(115deg,rgba(73,224,214,.18),rgba(155,140,251,.20))!important;color:#f5ffff!important;border:1px solid rgba(73,224,214,.20);box-shadow:0 14px 35px -24px rgba(73,224,214,.65),inset 0 1px rgba(255,255,255,.04)}
        .nav-link:not(.active):hover{background:rgba(255,255,255,.045)!important;color:#f4fbff!important;transform:translateY(-1px)}
        .btn-primary{background:linear-gradient(115deg,#49e0d6,#9b8cfb)!important;color:#07111f!important;font-weight:900;transition:filter .2s ease,transform .2s ease,box-shadow .2s ease;box-shadow:0 16px 34px -22px rgba(73,224,214,.65)}
        .btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
        input,select,textarea{color:#e8f0f7!important;background:rgba(4,14,25,.72)!important;border-color:rgba(148,163,184,.16)!important;min-height:42px}
        input:focus,select:focus,textarea:focus{outline:none!important;border-color:rgba(73,224,214,.48)!important;box-shadow:0 0 0 3px rgba(73,224,214,.09)!important}
        ::placeholder{color:#6f879c!important}
        option{background:#0b1b2b;color:#e8f0f7}
        .text-gray-300{color:#c4d1dc!important}.text-gray-400{color:#8da3b8!important}.text-gray-500{color:#70879b!important}
        .bg-black\/40,.bg-black\/30,.bg-black\/20{background:rgba(3,12,22,.62)!important}
        .bg-white\/10{background:rgba(255,255,255,.055)!important}.bg-white\/5{background:rgba(255,255,255,.025)!important}
        .border-white\/10,.border-white\/5,.border-white\/\[0\.1\]{border-color:rgba(148,163,184,.13)!important}
        .hover\:bg-white\/20:hover{background:rgba(255,255,255,.09)!important}.hover\:bg-white\/5:hover{background:rgba(255,255,255,.045)!important}
        .dir-ltr{direction:ltr;unicode-bidi:plaintext}
        table tbody tr{transition:background .2s ease,border-color .2s ease}
        table tbody tr:hover{background:rgba(73,224,214,.035)!important}
        .stat-glow{box-shadow:inset 0 1px rgba(255,255,255,.04),0 22px 55px -40px rgba(0,0,0,.8)}
        html,body{overflow-x:hidden;}
        img,svg,video,canvas{max-width:100%;height:auto;}
        main,aside,.admin-content,.panel{min-width:0;}
        .overflow-x-auto{-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
        @media(max-width:768px){
            main{padding:14px!important;}
            aside{position:relative!important;padding:10px!important;gap:4px;}
            aside > div:first-child{min-width:220px;}
            aside .nav-link{flex:0 0 auto;padding:9px 12px;font-size:11px;}
            aside{scrollbar-width:none;}
            aside::-webkit-scrollbar{display:none;}
            main > *{max-width:100%;}
            .panel{border-radius:18px!important;}
            table{max-width:100%;}
        }
        @media(max-width:480px){
            main{padding:10px!important;}
            aside > div:first-child{min-width:205px;margin-bottom:0!important;}
            aside .nav-link{padding:8px 10px;font-size:10px;}
            .panel{border-radius:16px!important;}
            h1{font-size:20px!important;}
        }
        @media(prefers-reduced-motion:reduce){.admin-bubble,.nav-link,.btn-primary{animation:none!important;transition:none!important}}
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen md:flex">
<div class="admin-bg" aria-hidden="true">
    <div class="admin-bubble" style="width:120px;height:120px;top:7%;right:5%;animation-duration:7.2s"></div>
    <div class="admin-bubble" style="width:58px;height:58px;top:34%;left:7%;animation-duration:5.6s;animation-delay:.8s"></div>
    <div class="admin-bubble" style="width:38px;height:38px;top:76%;right:18%;animation-duration:6.2s;animation-delay:1.2s"></div>
    <div class="admin-bubble" style="width:28px;height:28px;top:18%;left:31%;animation-duration:5s;animation-delay:.4s"></div>
</div>
<div class="admin-content min-h-screen w-full md:flex">
<aside class="w-full md:w-64 md:shrink-0 bg-[#091625]/92 backdrop-blur-xl border-b md:border-b-0 md:border-l border-white/10 p-4 flex md:flex-col gap-1 overflow-x-auto md:overflow-visible md:sticky md:top-0 md:h-screen z-10">
    <div class="mb-1 md:mb-7 px-2 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-cyan-300/90 to-violet-300/90 flex items-center justify-center shadow-lg shadow-cyan-500/15">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-width="1.7" d="M4 7.5A2.5 2.5 0 016.5 5h11A2.5 2.5 0 0120 7.5v9a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 014 16.5v-9z"/><path stroke-linecap="round" stroke-width="1.7" d="M8 9h8M8 13h5"/></svg>
            </div>
            <div><p class="text-sm font-black text-slate-100 leading-6">خشکشویی و سفید شویی آرین</p><p class="text-[10px] text-slate-500">پنل مدیریت</p></div>
        </div>
        <p class="text-[11px] text-slate-500 mt-3 px-1">{{ request.user.username }}</p>
    </div>
    <a href="{% url 'panel_dashboard' %}" class="nav-link {% if active == 'dashboard' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">داشبورد</a>
    <a href="{% url 'panel_orders' %}" class="nav-link {% if active == 'orders' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">سفارش‌ها</a>
    <a href="{% url 'panel_order_create' %}" class="nav-link {% if active == 'order_create' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">سفارش جدید</a>
    <a href="{% url 'panel_customers' %}" class="nav-link {% if active == 'customers' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">مشتریان</a>
    <a href="{% url 'panel_pricing' %}" class="nav-link {% if active == 'pricing' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">لیست قیمت</a>
    <a href="{% url 'panel_courier' %}" class="nav-link {% if active == 'courier' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">درخواست پیک</a>
    <a href="{% url 'panel_settings' %}" class="nav-link {% if active == 'settings' %}active{% endif %} rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2">تنظیمات</a>
    <div class="md:mt-auto md:pt-4 md:border-t border-white/10 shrink-0"><a href="{% url 'panel_logout' %}" class="nav-link rounded-xl px-3 py-2.5 text-sm font-bold flex items-center gap-2 text-red-400">خروج</a></div>
</aside>
<main class="flex-1 p-5 sm:p-8 relative z-[1]">
    {% if messages %}<div class="mb-5 space-y-2">{% for message in messages %}<div class="px-4 py-3 rounded-xl text-sm font-bold {% if message.tags == 'error' %}bg-red-500/10 border border-red-400/20 text-red-300{% else %}bg-emerald-500/10 border border-emerald-400/20 text-emerald-300{% endif %}">{{ message }}</div>{% endfor %}</div>{% endif %}
    {% block content %}{% endblock %}
</main>
</div>
<script>
document.querySelectorAll('.money-auto').forEach(function(el){var raw=String(el.textContent||'').replace(/[^0-9.-]/g,'');if(raw)el.textContent=Number(raw).toLocaleString('en-US');});
</script>
</body>
</html>
