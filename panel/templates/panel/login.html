<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خشکشویی و سفید شویی آرین | پنل مدیریت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root{ --ink:#eaf3f4; --bg-deep:#070b12; --line:rgba(234,243,244,0.10); --cyan:#49e0d6; --violet:#9b8cfb; }
        *{ font-family:'Vazirmatn', sans-serif; }
        body{
            background-color:var(--bg-deep); color:var(--ink);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(73,224,214,0.12), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(155,140,251,0.12), transparent 45%);
        }
        .panel{
            background:rgba(13,20,32,0.6);
            backdrop-filter:blur(20px);
            border:1px solid var(--line);
            box-shadow:0 30px 60px -20px rgba(0,0,0,0.65);
        }
        .fab-input:focus{ box-shadow:0 0 0 3px rgba(73,224,214,0.35); }
        ::placeholder{ color:rgba(234,243,244,0.35); }
        .site-bubbles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
        .bubble{position:absolute;border-radius:50%;border:1px solid rgba(73,224,214,.25);background:radial-gradient(circle at 28% 24%,rgba(255,255,255,.95) 0 10%,rgba(255,255,255,.22) 11% 20%,rgba(73,224,214,.13) 42%,rgba(155,140,251,.12) 68%,transparent 80%);box-shadow:inset -8px -10px 18px rgba(155,140,251,.08),0 14px 35px rgba(73,224,214,.08);will-change:transform,opacity;animation:bubbleFloat 6.2s ease-in-out infinite}
        .bubble:after{content:'';position:absolute;width:22%;height:22%;left:20%;top:18%;border-radius:50%;background:rgba(255,255,255,.5);filter:blur(1px)}
        @keyframes bubbleFloat{0%{transform:translate3d(0,35px,0) scale(.9);opacity:.32}25%{transform:translate3d(15px,-4px,0) scale(1.03);opacity:.62}50%{transform:translate3d(-8px,-35px,0) scale(.96);opacity:.85}75%{transform:translate3d(-18px,-8px,0) scale(1.06);opacity:.6}100%{transform:translate3d(4px,28px,0) scale(.9);opacity:.32}}
        .login-content{position:relative;z-index:2;width:100%;display:flex;align-items:center;justify-content:center;min-height:100dvh}
        @media(max-width:640px){.login-content{padding:12px}.panel{padding:22px!important;border-radius:24px!important}}
        @media(prefers-reduced-motion:reduce){.bubble{animation:none}}
    </style>
</head>
<body class="min-h-screen p-4">
    <div class="site-bubbles" aria-hidden="true">
        <div class="bubble" style="width:118px;height:118px;top:8%;right:7%;animation-duration:6.4s"></div>
        <div class="bubble" style="width:72px;height:72px;top:27%;left:8%;animation-duration:5.2s;animation-delay:1s"></div>
        <div class="bubble" style="width:46px;height:46px;top:64%;right:13%;animation-duration:4.8s;animation-delay:.4s"></div>
        <div class="bubble" style="width:34px;height:34px;top:79%;left:17%;animation-duration:5.8s;animation-delay:1.6s"></div>
        <div class="bubble" style="width:58px;height:58px;top:47%;right:34%;animation-duration:7s;animation-delay:2s"></div>
        <div class="bubble" style="width:26px;height:26px;top:18%;right:42%;animation-duration:5.4s;animation-delay:.7s"></div>
    </div>
    <div class="login-content">
    <div class="panel rounded-3xl p-8 w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="w-14 h-14 mx-auto mb-3 rounded-full bg-gradient-to-br from-[var(--cyan)] to-[var(--violet)] flex items-center justify-center">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="7" stroke-width="1.6"/>
                    <path d="M9 9c0 2 1.2 4 3 5.5M15 15c0-2-1.2-4-3-5.5" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="text-lg font-black">خشکشویی و سفید شویی آرین</h1><p class="text-[11px] text-gray-400 mt-1">ورود به پنل مدیریت</p>
        </div>

        {% if error %}
            <div class="bg-red-500/15 border border-red-500/30 text-red-300 px-4 py-3 rounded-xl text-sm font-bold mb-4 text-center">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="نام کاربری" required autofocus
                   class="fab-input w-full bg-black/40 px-4 py-3.5 rounded-xl border border-white/10 text-sm mb-3 focus:outline-none">
            <input type="password" name="password" placeholder="رمز عبور" required
                   class="fab-input w-full bg-black/40 px-4 py-3.5 rounded-xl border border-white/10 text-sm mb-5 focus:outline-none">
            <button type="submit" class="w-full bg-gradient-to-l from-[var(--cyan)] to-[var(--violet)] text-gray-950 font-extrabold py-3.5 rounded-xl shadow-lg shadow-cyan-500/20 hover:brightness-110 transition">ورود</button>
        </form>
    </div>
    </div>
</body>
</html>
