<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود مشتری | {{ shop_name|default:"خشکشویی و سفید شویی آرین" }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{--cyan:#49e0d6;--violet:#9b8cfb}
*{box-sizing:border-box}body{font-family:Vazirmatn,sans-serif;background:#f5f8fa;overflow-x:hidden;position:relative}
.panel{position:relative;z-index:3;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border:1px solid #e2e8f0;box-shadow:0 25px 50px -25px rgba(15,23,42,.18)}
.site-bubbles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.bubble{position:absolute;border-radius:50%;border:1px solid rgba(73,170,205,.4);background:radial-gradient(circle at 28% 24%,rgba(255,255,255,.98) 0 11%,rgba(255,255,255,.55) 12% 20%,rgba(73,224,214,.22) 42%,rgba(155,140,251,.13) 68%,transparent 80%);box-shadow:inset -8px -10px 18px rgba(124,58,237,.07),0 14px 35px rgba(8,145,178,.11);will-change:transform,opacity;animation:bubbleFloat 6s ease-in-out infinite}
.bubble:after{content:'';position:absolute;width:22%;height:22%;left:20%;top:18%;border-radius:50%;background:rgba(255,255,255,.8);filter:blur(1px)}
@keyframes bubbleFloat{0%{transform:translate3d(0,35px,0) scale(.9);opacity:.38}25%{transform:translate3d(15px,-4px,0) scale(1.03);opacity:.75}50%{transform:translate3d(-8px,-35px,0) scale(.96);opacity:.95}75%{transform:translate3d(-18px,-8px,0) scale(1.06);opacity:.72}100%{transform:translate3d(4px,28px,0) scale(.9);opacity:.38}}
.login-shell{position:relative;z-index:2;width:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
@media(max-width:640px){.login-shell{padding:14px}.panel{border-radius:24px!important;padding:22px!important}}
@media(prefers-reduced-motion:reduce){.bubble{animation:none}}
</style>
</head>
<body class="min-h-screen px-5">
<div class="site-bubbles" aria-hidden="true">
<div class="bubble" style="width:118px;height:118px;top:8%;right:7%;animation-duration:6.4s"></div>
<div class="bubble" style="width:72px;height:72px;top:26%;left:8%;animation-duration:5.2s;animation-delay:1s"></div>
<div class="bubble" style="width:46px;height:46px;top:63%;right:13%;animation-duration:4.8s;animation-delay:.4s"></div>
<div class="bubble" style="width:34px;height:34px;top:78%;left:17%;animation-duration:5.8s;animation-delay:1.6s"></div>
<div class="bubble" style="width:58px;height:58px;top:47%;right:34%;animation-duration:7s;animation-delay:2s"></div>
<div class="bubble" style="width:26px;height:26px;top:18%;right:42%;animation-duration:5.4s;animation-delay:.7s"></div>
</div>
<div class="login-shell">
<div class="panel w-full max-w-md rounded-3xl p-7">
<div class="text-center mb-7"><h1 class="text-2xl font-black mb-2">ورود مشتری</h1><p class="text-sm text-gray-500">برای مشاهده و پیگیری فاکتور، شماره موبایل و شماره فاکتور را وارد کنید.</p></div>
{% if error %}<div class="bg-red-50 border border-red-200 text-red-600 rounded-xl p-3 text-xs font-bold mb-4">{{ error }}</div>{% endif %}
<form method="post" class="space-y-4">
{% csrf_token %}
<input name="phone" type="tel" inputmode="numeric" required placeholder="شماره موبایل" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm text-center focus:outline-none">
<input name="order_id" type="number" required placeholder="شماره فاکتور" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm text-center focus:outline-none">
<button class="w-full py-3.5 rounded-xl font-extrabold bg-gradient-to-l from-cyan-300 to-violet-300">ورود و مشاهده فاکتور</button>
</form>
<div class="flex items-center justify-between mt-5 text-xs"><a href="/" class="text-gray-500 hover:text-cyan-600">بازگشت به سایت</a><a href="/panel/login/" class="font-bold text-gray-700">ورود مدیریت</a></div>
</div>
</div>
</body></html>
