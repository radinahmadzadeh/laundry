<!DOCTYPE html>

<title>اتصال اینترنت برقرار نیست | خشکشویی و سفید شویی آرین</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(135deg,#ecfeff,#f5f3ff);color:#0f172a;font-family:Vazirmatn,Tahoma,sans-serif;text-align:center}
.card{width:100%;max-width:360px;padding:32px 22px;border-radius:26px;background:#fff;border:1px solid #e2e8f0;box-shadow:0 30px 60px -36px rgba(15,23,42,.35)}
.icon{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#49e0d6,#9b8cfb);color:#fff}
h1{margin:0 0 10px;font-size:18px;font-weight:900}
p{margin:0 0 22px;font-size:13px;line-height:2;color:#64748b}
button{width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-size:14px;font-weight:900;color:#04141a;background:linear-gradient(115deg,#49e0d6,#9b8cfb);cursor:pointer;min-height:48px}

<body>
<main class="card">

</main>
