<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>اتصال اینترنت برقرار نیست | خشکشویی و سفید شویی آرین</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(circle at 50% 0%,#12324a 0%,#070b12 60%);color:#e2e8f0;font-family:Vazirmatn,Tahoma,sans-serif;text-align:center}
.card{width:100%;max-width:360px;padding:32px 22px;border-radius:26px;background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.18);box-shadow:0 24px 60px -30px rgba(0,0,0,.9)}
.icon{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#07131a}
h1{margin:0 0 10px;font-size:18px;font-weight:900}
p{margin:0 0 22px;font-size:13px;line-height:2;color:#94a3b8}
button{width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-size:14px;font-weight:900;color:#07131a;background:linear-gradient(115deg,#22d3ee,#8b5cf6);cursor:pointer}
</style>
</head>
<body>
<main class="card">
  <div class="icon" aria-hidden="true">
    <svg width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><path d="M12 19h.01"/><path d="M3 3l18 18"/></svg>
  </div>
  <h1>اتصال اینترنت برقرار نیست</h1>
  <p>برای پیگیری سفارش و استفاده از خدمات، اتصال اینترنت خود را بررسی کنید و دوباره تلاش کنید.</p>
  <button type="button" onclick="location.reload()">تلاش دوباره</button>
</main>
</body>
</html>
