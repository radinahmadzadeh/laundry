{# Small stroke icon for one tracker step; pass key=<status>, or key="done" for a check mark. #}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

{% elif key == 'received' %}<path d="M5.5 8.5h13l-1 11.5h-11z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/>
{% elif key == 'washing' %}<rect x="4.5" y="3" width="15" height="18" rx="3"/><path d="M4.5 7h15"/><circle cx="12" cy="14" r="4"/><path d="M9.5 14.3c1-.9 1.8.9 2.6 0s1.6-.9 2.4 0"/>

{% elif key == 'delivered' %}<path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/>
{% else %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{% endif %}</svg>
