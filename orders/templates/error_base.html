{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>{% block title %}خطا{% endblock %} | خشکشویی و سفید شویی آرین</title>
<link rel="preload" href="{% static 'fonts/Vazirmatn-wght.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{% static 'css/vazirmatn.css' %}">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(135deg,#ecfeff,#f5f3ff);color:#0f172a;font-family:Vazirmatn,Tahoma,sans-serif;text-align:center}
.card{width:100%;max-width:400px;padding:34px 24px;border-radius:26px;background:#fff;border:1px solid #e2e8f0;box-shadow:0 30px 60px -36px rgba(15,23,42,.35)}
.code{font-size:56px;font-weight:900;line-height:1;background:linear-gradient(115deg,#0891b2,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px}
h1{margin:0 0 10px;font-size:20px;font-weight:900}
p{margin:0 0 22px;font-size:14px;line-height:2;color:#64748b}
.actions{display:flex;flex-direction:column;gap:10px}
a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;font-weight:800;font-size:14px;text-decoration:none}
.primary{background:linear-gradient(115deg,#49e0d6,#9b8cfb);color:#04141a}
.secondary{background:#f8fafc;border:1px solid #e2e8f0;color:#334155}
</style>
</head>
<body>
<main class="card">
    <div class="code">{% block code %}!{% endblock %}</div>
    <h1>{% block heading %}مشکلی پیش آمد{% endblock %}</h1>
    <p>{% block message %}{% endblock %}</p>
    <div class="actions">
        <a class="primary" href="/">بازگشت به صفحه اصلی</a>
        <a class="secondary" href="/pricing/">مشاهده لیست قیمت</a>
    </div>
</main>
</body>
</html>
